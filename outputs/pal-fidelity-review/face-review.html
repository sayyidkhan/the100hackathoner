<!doctype html><html><head><meta charset="utf-8"><title>Pal facial sculpture review</title><style>body{margin:0;background:#e8dfd0;font:14px system-ui;color:#433c33}h1{font:22px Georgia;margin:22px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#bfb09a}figure{margin:0;background:#ede5d8}canvas{display:block;width:100%;aspect-ratio:1.1}figcaption{padding:8px 16px 14px;text-transform:capitalize;letter-spacing:.05em}</style></head><body><h1>Pal · facial sculpting / neutral studio light</h1><main></main><script type="module">
import * as THREE from '/landing/vendor/three.module.js';
import {createWorkshop} from '/landing/artifacts/pal-workshop.js';
import {buildCompanions} from '/landing/artifacts/pal-companions.js';
const workshop=createWorkshop(THREE),cast=buildCompanions(workshop,()=>{});workshop.batch(workshop.root);
for(const [name,angle] of [['sheikh',0],['sheikh',.65],['messenger',.25],['writer',.2],['reviewer',.35],['guardian',.25],['healer',.2],['builder',.2],['strategist',.25]]){
 const actor=cast.find(a=>a.name===name),head=actor.getObjectByName('head').clone();head.position.set(0,0,0);head.rotation.set(0,angle,0);
 const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');caption.textContent=name+(angle===.65?' · three-quarter':'');figure.append(canvas,caption);document.querySelector('main').append(figure);
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(1.5);renderer.setSize(400,360,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
 const scene=new THREE.Scene();scene.background=new THREE.Color(0xede5d8);scene.add(head);scene.add(new THREE.HemisphereLight(0xfff0d9,0x7a6b58,1.1));
 const key=new THREE.DirectionalLight(0xfff5e5,2.5);key.position.set(-3,5,4);scene.add(key);const fill=new THREE.DirectionalLight(0xe5ebff,.7);fill.position.set(3,1,3);scene.add(fill);
 const cam=new THREE.PerspectiveCamera(30,400/360,.01,10);cam.position.set(0,.19,1.7);cam.lookAt(0,.14,0);renderer.render(scene,cam);
}
</script></body></html>
