<!doctype html><html lang="en"><meta charset="utf-8"><title>Hedera motion review</title><style>body{margin:0;background:#101112;color:#e9eee9;font:14px system-ui}main{max-width:1000px;margin:auto}nav{display:flex;gap:12px;padding:16px}button{background:#18362a;color:#ccf5df;border:1px solid #476255;padding:10px 18px;border-radius:20px;cursor:pointer}#stage{height:680px;background:radial-gradient(ellipse at center,#214433,#08130f 78%)}canvas{width:100%;height:100%;display:block}p{padding:0 16px}</style><main><nav><button data-time="1">Discover</button><button data-time="8">Negotiate</button><button data-time="14">Settle</button><button data-time="19">Verified</button></nav><div id="stage"><canvas aria-label="Hedera animation review" tabindex="0"></canvas></div><p id="status"></p></main><script type="module">
import {createGalleryScene} from '/landing/scene.js';
import {createArtifact} from '/landing/artifacts/hedera-agents.js';
let selected=8;
const scene=createGalleryScene({canvas:document.querySelector('canvas'),container:document.querySelector('#stage'),initialProject:46,projectIds:new Set([46]),theme:'dark',artifactFactory(T){const root=createArtifact(T),animate=root.userData.animate;root.userData.animate=()=>animate(selected);return root;},onStoryChange(s){document.querySelector('#status').textContent=s?.title??'';}});
scene.setActive(true);scene.setPaused(true);
document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{selected=Number(button.dataset.time);scene.setPaused(true);}));
</script></html>
